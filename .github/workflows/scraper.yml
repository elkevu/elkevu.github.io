name: Scraper de Novedades Jurídicas

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días a las 11:00 UTC (8:00am Argentina)
  workflow_dispatch:        # esto te deja también apretar "Run" a mano cuando quieras probarlo

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código del repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 supabase

      - name: Correr el scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py
